# How this app goes from a commit to live on Nexlayer.
# Written by Nexlayer from what it read in this repo; owned by your coding
# agent from here. Every agent and CI runs exactly this. Secret VALUES are
# never written here.
app: full-stack-fastapi-template
deploy:
  config: nexlayer.yaml   # a draft, added by this plan — check it
  environment: ~   # set by the first deploy
  through: nexlayer-mcp          # validate -> deploy -> status; nothing deploys around it
build:
  - pod: frontend             # the nexlayer.yaml pod that runs it
    image: full-stack-fastapi-template-frontend         # registry.nexlayer.io/<your user id>/full-stack-fastapi-template-frontend:<tag>
    context: .
    dockerfile: frontend/Dockerfile
    platform: linux/amd64
    tag: git-sha                 # immutable; "latest" is rejected
    # read from `frontend/Dockerfile`
  - pod: backend             # the nexlayer.yaml pod that runs it
    image: full-stack-fastapi-template-backend         # registry.nexlayer.io/<your user id>/full-stack-fastapi-template-backend:<tag>
    context: .
    dockerfile: backend/Dockerfile
    platform: linux/amd64
    tag: git-sha                 # immutable; "latest" is rejected
    # read from `backend/Dockerfile`
services:
  - name: frontend
    port: 80
    public: true   # read from `.nexlayer/drafts/nexlayer.yaml`
  - name: backend
    port: 8000
    public: true   # read from `.nexlayer/drafts/nexlayer.yaml`
  - name: db
    image: 'mirror.gcr.io/library/postgres:18'
    port: 5432
    public: false   # read from `.nexlayer/drafts/nexlayer.yaml`
verify:                         # done means all of these pass
  - service: frontend
    status: running             # nexlayer_check_deployment_status
  - service: backend
    status: running             # nexlayer_check_deployment_status
  - service: db
    status: running             # nexlayer_check_deployment_status
  - url: /                       # the live URL answers 2xx/3xx with a real page
secrets:                        # names only — values live in Nexlayer
  - name: SECRET_KEY
    status: needed_from_human
  - name: FIRST_SUPERUSER_PASSWORD
    status: needed_from_human
  - name: FIRST_SUPERUSER
    status: needed_from_human
buildConfig:                    # public build-time values, baked into the bundle
  VITE_API_URL: 'http://localhost:8000'
rollback: redeploy the previous image tag from the Nexlayer deploy history
notes:                          # from the analysis — keep what holds, fix what doesn't
  - 'Three pods: db (PostgreSQL), backend (FastAPI/uvicorn on 8000), and frontend (static Vite build served by nginx on 80). The Traefik proxy, Adminer and Mailcatcher from Compose are not needed, because Nexlayer handles routing and ingress.'
  - 'The backend reaches the database at db.pod:5432 (POSTGRES_SERVER=db.pod, POSTGRES_PORT=5432). Never use localhost or the Compose service name ''db''.'
  - 'The Compose ''prestart'' service (backend/scripts/prestart.sh: wait for DB, alembic upgrade head, create initial superuser) is a one-shot job, not a daemon. Run it in the backend pod''s start command before launching uvicorn, e.g. `bash scripts/prestart.sh && fastapi run --workers 4 app/main.py`.'
  - 'Backend and frontend images are built from their own Dockerfiles (backend/Dockerfile uses uv; frontend/Dockerfile runs a Bun/Node build then nginx). The listed base images are the mirror.gcr.io equivalents to use in those Dockerfiles.'
  - 'VITE_API_URL is baked into the frontend at build time, so set it to the backend pod''s public URL before building the frontend image.'
  - 'Set BACKEND_CORS_ORIGINS and FRONTEND_HOST to the frontend''s public URL so browser calls to the backend pass CORS and email links resolve.'
  - 'Do not leave SECRET_KEY, FIRST_SUPERUSER_PASSWORD or POSTGRES_PASSWORD as ''changethis'' outside local: the app refuses to start with default secrets when ENVIRONMENT is not local. The Postgres password is generated by Nexlayer and shared with the backend as POSTGRES_PASSWORD.'
  - 'The exact file contents of backend/ and frontend/ were not provided, so ports and start commands follow the standard template conventions (backend 8000, frontend nginx 80).'
